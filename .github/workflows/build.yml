name: Build VISCACameraController

on:
  push:
    branches:
      - "*" # Matches all branches
  pull_request:
    branches:
      - "*" # Matches all branches
  workflow_dispatch: # Allows manual execution of the workflow

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore VISCACameraController/VISCACameraController.csproj

      - name: Build solution
        run: dotnet build VISCACameraController/VISCACameraController.csproj --configuration Release

      - name: Publish application
        run: dotnet publish VISCACameraController/VISCACameraController.csproj --configuration Release --output ./publish
